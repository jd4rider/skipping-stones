name: Deploy web version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=optional
      # The tests replay every stored challenge proof through the physics, so a
      # broken generator or a drifting constant can never reach the live site.
      - run: npm test
      - run: npm run build
      # The arcade links /play/, so the same build is served from the root and
      # from /play/ with relative asset paths.
      - name: Add play route
        run: |
          mkdir -p dist/play
          cp -r dist/index.html dist/assets dist/favicon.svg dist/arcade-client.js dist/play/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
