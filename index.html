<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta
      name="description"
      content="Skipping Stones — flick a flat stone across five lakes and keep it skipping. A physics arcade game with 100 challenges, daily stones and no downloads. Play free in your browser."
    />
    <meta name="theme-color" content="#0c2333" />
    <meta property="og:title" content="Skipping Stones — how many skips can you get?" />
    <meta property="og:description" content="Drag to aim, release to throw. Flat stones, spinning, wind, and five lakes to cross." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://skippingstones.littlejoyarcade.site/" />
    <title>Skipping Stones</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0c2333;
        overflow: hidden;
        touch-action: none;
      }
      body {
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        width: 100%;
        height: 100%;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        box-sizing: border-box;
      }
      #game canvas {
        display: block;
        margin: 0 auto;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/phaser/main.js"></script>
    <script src="./arcade-client.js" data-game-id="skipping-stones"></script>
  </body>
</html>
